<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Partial Quiz - Steam Edition</title>
    <style>
        /* --- CSS Variables & Base Styles --- */
        :root {
            --bg-color: #1a1a1a;
            --panel-bg: #2a2a2a;
            --brass: #b5a642;
            --brass-dark: #8c7e2a;
            --copper: #b87333;
            --silver: #a0a0a0;
            --glow: #e0d070;
            --leather: #6b4c35;
            --text-main: #dcdcdc;
            --font-display: 'Courier New', Courier, monospace;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 50%, #2a2a2a 0%, #111 100%),
                repeating-linear-gradient(45deg, rgba(0,0,0,0.1) 0, rgba(0,0,0,0.1) 10px, transparent 10px, transparent 20px);
            color: var(--text-main);
            font-family: var(--font-display);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Animations --- */
        @keyframes gear-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes steam-pulse { 0% { opacity: 0.3; } 50% { opacity: 0.6; } 100% { opacity: 0.3; } }
        @keyframes click-press { 0% { transform: scale(1); } 50% { transform: scale(0.95); } 100% { transform: scale(1); } }
        @keyframes plate-open { 0% { transform: rotateX(0deg); opacity: 1; } 100% { transform: rotateX(90deg); opacity: 0; } }
        @keyframes text-reveal { 0% { opacity: 0; text-shadow: none; } 100% { opacity: 1; text-shadow: 0 0 8px var(--glow); } }

        /* --- UI Components --- */
        .container {
            width: 100%;
            max-width: 800px;
            padding: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Panels with metallic look */
        .panel {
            background: linear-gradient(135deg, #3a3a3a, #222);
            border: 4px solid var(--brass);
            border-radius: 8px;
            box-shadow: 
                inset 0 0 20px rgba(0,0,0,0.8),
                0 10px 20px rgba(0,0,0,0.5),
                0 0 0 2px #000;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
        }
        
        /* Screws */
        .panel::before, .panel::after {
            content: '';
            position: absolute;
            width: 12px;
            height: 12px;
            background: radial-gradient(circle, var(--silver) 20%, #444 80%);
            border-radius: 50%;
            box-shadow: 0 2px 2px rgba(0,0,0,0.5);
            top: 8px;
        }
        .panel::before { left: 8px; }
        .panel::after { right: 8px; }

        h1, h2, h3 {
            text-align: center;
            color: var(--brass);
            text-shadow: 2px 2px 0 #000;
            margin-top: 0;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Buttons (Steam valves/switches) */
        button {
            background: linear-gradient(to bottom, var(--brass), var(--brass-dark));
            border: 2px solid #4a3b1a;
            border-radius: 4px;
            color: #1a0f00;
            font-family: var(--font-display);
            font-weight: bold;
            font-size: 1.1em;
            padding: 10px 20px;
            cursor: pointer;
            box-shadow: 0 4px 0 #4a3b1a, 0 5px 10px rgba(0,0,0,0.5);
            transition: transform 0.1s, box-shadow 0.1s;
            text-transform: uppercase;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #4a3b1a, inset 0 2px 5px rgba(0,0,0,0.5);
        }
        button:disabled {
            filter: grayscale(100%);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
            background: #555;
            color: #888;
        }
        button.danger {
            background: linear-gradient(to bottom, #d64541, #a12f2b);
            border-color: #631d1b;
            box-shadow: 0 4px 0 #631d1b, 0 5px 10px rgba(0,0,0,0.5);
            color: white;
        }
        button.danger:active {
            box-shadow: 0 0 0 #631d1b;
        }

        /* --- Gauges --- */
        .gauge-container {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            background: #000;
            padding: 10px;
            border: 2px solid var(--silver);
            border-radius: 30px;
            box-shadow: inset 0 0 10px #000;
        }
        .gauge {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }
        .gauge-label {
            font-size: 0.8em;
            color: var(--silver);
        }
        .gauge-value {
            font-size: 1.5em;
            color: var(--glow);
            text-shadow: 0 0 5px var(--glow);
        }
        .mp-bar-bg {
            width: 100%;
            height: 10px;
            background: #333;
            border-radius: 5px;
            margin-top: 5px;
            overflow: hidden;
            border: 1px solid #555;
        }
        .mp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #d35400, #f39c12);
            width: 100%;
            transition: width 0.5s ease-out;
            box-shadow: 0 0 5px #f39c12;
        }

        /* --- Game Area --- */
        #game-area {
            display: none;
        }
        .info-panel {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 0.9em;
            color: var(--silver);
            border-bottom: 1px dashed var(--silver);
            padding-bottom: 5px;
        }

        /* Question Analyzer (Plate display) */
        .analyzer-display {
            min-height: 150px;
            background: #111;
            border: 2px inset #555;
            padding: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }
        /* Background gears for decor */
        .bg-gear {
            position: absolute;
            opacity: 0.1;
            z-index: 0;
            pointer-events: none;
        }
        .gear-1 { width: 100px; top: 10px; left: 10px; animation: gear-spin 20s linear infinite; }
        .gear-2 { width: 80px; bottom: 10px; right: 10px; animation: gear-spin 15s linear infinite reverse; }

        /* Question Parts */
        .q-part {
            position: relative;
            z-index: 1;
            cursor: pointer;
            transition: transform 0.2s;
            user-select: none;
        }
        .q-part:hover {
            transform: scale(1.05);
        }
        .plate-cover {
            background: linear-gradient(to bottom, #5a5a5a, #333);
            border: 2px solid #888;
            color: transparent;
            min-width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 5px rgba(0,0,0,0.5);
            border-radius: 4px;
            position: relative;
        }
        /* Rivets on plate */
        .plate-cover::after {
            content: 'x';
            color: #222;
            font-size: 10px;
            position: absolute;
            top: 2px; right: 2px;
        }
        .plate-cover::before {
            content: 'x';
            color: #222;
            font-size: 10px;
            position: absolute;
            bottom: 2px; left: 2px;
        }
        .plate-text {
            display: none;
            background: rgba(255, 250, 240, 0.9); /* Parchment color */
            color: #000;
            padding: 8px 12px;
            border-radius: 4px;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.5);
            font-weight: bold;
            font-size: 1.2em;
            animation: text-reveal 0.5s forwards;
            min-width: 30px;
            text-align: center;
        }
        .q-part.opened .plate-cover {
            display: none;
        }
        .q-part.opened .plate-text {
            display: block;
        }
        .q-part.opened {
            cursor: default;
            transform: none !important;
        }

        /* --- Action Area --- */
        .action-area {
            background: #222;
            padding: 15px;
            border-top: 2px solid var(--brass);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            flex: 1;
            background: #000;
            border: 2px solid var(--copper);
            color: var(--glow);
            font-family: var(--font-display);
            font-size: 1.2em;
            padding: 10px;
            outline: none;
            box-shadow: inset 0 0 5px #000;
        }
        input[type="text"]:focus {
            border-color: var(--glow);
        }
        
        .sub-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .attempts-display {
            display: flex;
            gap: 5px;
        }
        .bulb {
            width: 20px;
            height: 20px;
            background: #333;
            border: 1px solid #555;
            border-radius: 50%;
            box-shadow: inset 0 0 5px #000;
        }
        .bulb.lit {
            background: #00ff00;
            box-shadow: 0 0 10px #00ff00, inset 0 0 2px #fff;
            border-color: #fff;
        }
        .bulb.broken {
            background: #330000;
            border-color: #500;
        }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(2px);
        }
        .modal {
            background: #2a2a2a;
            border: 4px double var(--brass);
            padding: 30px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            position: relative;
        }
        .modal h2 {
            font-size: 1.8em;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--brass-dark);
            padding-bottom: 10px;
        }
        
        /* Range Slider for MP Bet */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
            margin: 20px 0;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 30px;
            width: 30px;
            border-radius: 50%;
            background: radial-gradient(#dcdcdc, #808080);
            border: 2px solid var(--brass);
            cursor: pointer;
            margin-top: -12px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 6px;
            cursor: pointer;
            background: #111;
            border: 1px solid #555;
            border-radius: 3px;
        }
        .bet-value {
            font-size: 3em;
            color: var(--glow);
            font-weight: bold;
            margin: 10px 0;
            text-shadow: 0 0 10px var(--brass);
        }

        /* Start Screen */
        #start-screen {
            text-align: center;
        }
        .logo-box {
            border: 8px solid var(--brass);
            padding: 40px;
            margin-bottom: 30px;
            background: #222;
            display: inline-block;
            box-shadow: 
                0 0 20px rgba(0,0,0,0.8),
                inset 0 0 20px rgba(0,0,0,0.8);
        }
        .title-main {
            font-size: 3em;
            margin: 0;
            line-height: 1;
            color: var(--brass);
            text-shadow: 2px 2px 0 #000, 0 0 15px var(--brass-dark);
        }
        .title-sub {
            font-size: 1.2em;
            color: var(--silver);
            margin-top: 10px;
            letter-spacing: 5px;
        }
        .high-score {
            margin-top: 20px;
            color: var(--copper);
        }

        /* Result Screen */
        .result-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            border-bottom: 1px dotted #555;
            padding-bottom: 5px;
        }
        .total-score {
            font-size: 2.5em;
            color: var(--glow);
            margin: 20px 0;
            text-shadow: 0 0 10px rgba(255,215,0,0.3);
        }

        /* Feedback Message */
        #feedback-msg {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--brass);
            padding: 20px 40px;
            font-size: 2em;
            color: #fff;
            z-index: 200;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s;
            text-shadow: 0 0 5px #fff;
        }
        #feedback-msg.show {
            opacity: 1;
        }
        #feedback-msg.correct { color: #00ff00; border-color: #00ff00; }
        #feedback-msg.wrong { color: #ff0000; border-color: #ff0000; }

    </style>
</head>
<body>

    <div id="start-screen" class="container">
        <div class="logo-box">
            <h1 class="title-main">Partial<br>Quiz</h1>
            <div class="title-sub">- Steam Engine -</div>
        </div>
        <div>
            <button onclick="Game.init()" style="font-size: 1.5em; padding: 15px 40px;">Game Start</button>
        </div>
        <div class="high-score">High Score: <span id="hs-display">0</span></div>
    </div>

    <div id="game-area" class="container">
        <div class="gauge-container">
            <div class="gauge">
                <span class="gauge-label">PRESSURE (MP)</span>
                <span class="gauge-value" id="mp-display">50</span>
                <div class="mp-bar-bg"><div id="mp-bar" class="mp-bar-fill" style="width: 100%;"></div></div>
            </div>
            <div class="gauge">
                <span class="gauge-label">SCORE</span>
                <span class="gauge-value" id="score-display">0</span>
            </div>
        </div>

        <div class="panel">
            <div class="info-panel">
                <span id="stage-display">STAGE 1 / 5</span>
                <span id="char-count-display">Length: --</span>
            </div>

            <div class="analyzer-display" id="question-board">
                <svg class="bg-gear gear-1"><use href="#gear-icon"/></svg>
                <svg class="bg-gear gear-2"><use href="#gear-icon"/></svg>
            </div>

            <div class="action-area">
                <div class="input-group">
                    <input type="text" id="answer-input" placeholder="Enter Answer..." autocomplete="off">
                    <button onclick="Game.submitAnswer()">SEND</button>
                </div>
                <div class="sub-actions">
                    <div class="attempts-display" id="attempts-container">
                        <div class="bulb lit"></div>
                        <div class="bulb lit"></div>
                        <div class="bulb lit"></div>
                    </div>
                    <div>
                        <button onclick="Game.pass()" style="font-size: 0.8em; margin-right: 5px;">PASS</button>
                        <button class="danger" onclick="Game.giveUp()" style="font-size: 0.8em;">GIVE UP</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="bet-modal" class="modal-overlay">
        <div class="modal">
            <h2>INJECT ENERGY</h2>
            <p>Determine split resource (MP) for analysis.</p>
            <p style="font-size: 0.8em; color: #888;">More MP = More Parts (Easier to read)<br>Less MP = Higher Bonus</p>
            <div class="bet-value" id="bet-val-display">1</div>
            <input type="range" id="bet-slider" min="1" max="50" value="1" oninput="Game.updateBetDisplay()">
            <button onclick="Game.confirmBet()">ACTIVATE ENGINE</button>
        </div>
    </div>

    <div id="result-modal" class="modal-overlay">
        <div class="modal">
            <h2 id="result-title">STAGE CLEARED</h2>
            <div id="result-details">
                </div>
            <br>
            <button onclick="Game.nextLevel()">NEXT STAGE</button>
        </div>
    </div>

    <div id="final-modal" class="modal-overlay">
        <div class="modal">
            <h2>MISSION COMPLETE</h2>
            <div class="total-score" id="final-score">0</div>
            <p id="rank-display">Rank: F</p>
            <button onclick="location.reload()">RESTART SYSTEM</button>
        </div>
    </div>

    <div id="feedback-msg">CORRECT!</div>

    <script>
        // --- Data ---
        // 埋め込みデータ (Generated from CSV)
        const questionsData = [{"id": 1, "text": "令和元年は西暦何年？", "answer": "2019", "answerLen": 4}, {"id": 2, "text": "1ダースは何個のこと？", "answer": "12", "answerLen": 2}, {"id": 3, "text": "1週間は何日間のこと？", "answer": "7", "answerLen": 1}, {"id": 4, "text": "五角形を英語で何という？", "answer": "ぺんたごん", "answerLen": 5}, {"id": 5, "text": "囲碁で使う石の色は白と何？", "answer": "くろ", "answerLen": 2}, {"id": 6, "text": "「百足」この漢字は何と読む？", "answer": "むかで", "answerLen": 3}, {"id": 7, "text": "旧暦で12月のことを何という？", "answer": "しわす", "answerLen": 3}, {"id": 8, "text": "日本で一番面積が広い都道府県は？", "answer": "ほっかいどう", "answerLen": 6}, {"id": 9, "text": "信号機で「止まれ」を意味する色は？", "answer": "あか", "answerLen": 2}, {"id": 10, "text": "地球の周りを回っている唯一の衛星は？", "answer": "つき", "answerLen": 2}, {"id": 11, "text": "なぞなぞです。冷蔵庫の中にいる動物は？", "answer": "ぞう", "answerLen": 2}, {"id": 12, "text": "設定した時間になるとベルなどが鳴動する時計は？", "answer": "めざましどけい", "answerLen": 7}, {"id": 13, "text": "演技が平坦に見える人を、野菜に例えて何という？", "answer": "だいこんやくしゃ", "answerLen": 8}, {"id": 14, "text": "なぞなぞです。「8,999999…」これ何の動物？", "answer": "くじゃく", "answerLen": 4}, {"id": 15, "text": "世界で一番高い山「エベレスト」がある山脈の名前は何？", "answer": "ひまらや", "answerLen": 4}, {"id": 16, "text": "将棋の駒で、唯一「成る」ことができない一番弱い駒は何？", "answer": "ふひょう", "answerLen": 4}, {"id": 17, "text": "主にテニスや野球などのスポーツ時、手首に着ける装飾品は？", "answer": "りすとばんど", "answerLen": 6}, {"id": 18, "text": "音楽の父と呼ばれ、「G線上のアリア」等を作曲した人物は？", "answer": "ばっは", "answerLen": 3}, {"id": 19, "text": "童話『ピノキオ』で、嘘をつくと伸びてしまう体の一部はどこ？", "answer": "はな", "answerLen": 2}, {"id": 20, "text": "毎年1月1日に届く、新年の挨拶が書かれたハガキを何という？", "answer": "ねんがじょう", "answerLen": 6}, {"id": 21, "text": "年が明けてから初めて神社や寺院などに参拝する行事を何という？", "answer": "はつもうで", "answerLen": 5}, {"id": 22, "text": "首が非常に長く、高い場所の葉を食べる、アフリカに住む動物は？", "answer": "きりん", "answerLen": 3}, {"id": 23, "text": "鉛筆の芯の主な原料で、ダイヤモンドと同じ炭素からなる物質は？", "answer": "こくえん", "answerLen": 4}, {"id": 24, "text": "1789年に起こり、ルイ16世が処刑された市民革命を何という？", "answer": "ふらんすかくめい", "answerLen": 8}, {"id": 25, "text": "七転八倒、二束三文、岡目八目。出てきた漢数字を全て足すといくつ？", "answer": "28", swerLen": 8}, {"id": 63, "text": "1972年のユネスコ総会で採択された条約に基づき、人類共通の財産として未来に引き継ぐべき価値があると認められた遺跡や自然環境のことで、日本では法隆寺や姫路城、知床、屋久島などが登録されているものを総称して何という？", "answer": "せかいいさん", "answerLen": 6}, {"id": 64, "text": "「誰もが自由に編集できるフリー百科事典」を掲げる多言語プロジェクトで、その名称はハワイ語で「速い」を意味する言葉と「エンサイクロペディア」を掛け合わせた造語であり、2001年にジミー・ウェールズらによって開始されたWebサイトは何？", "answer": "うぃきぺでぃあ", "answerLen": 7}];

        // --- Game Logic ---
        const Game = {
            state: {
                currentQIndex: 0,
                remainingMP: 50,
                totalScore: 0,
                questions: [],
                
                // Current Question State
                currentQ_betMP: 0,
                currentQ_openedParts: 0,
                currentQ_attempts: 0,
                parts: [] // array of {text: string, opened: bool}
            },

            init: function() {
                // Initialize High Score
                const hs = localStorage.getItem('pq_highscore');
                document.getElementById('hs-display').innerText = hs ? hs : 0;

                // Pick 5 random questions
                const shuffled = [...questionsData].sort(() => 0.5 - Math.random());
                this.state.questions = shuffled.slice(0, 5).map((q, i) => ({...q, level: i + 1}));
                
                // Reset State
                this.state.currentQIndex = 0;
                this.state.remainingMP = 50;
                this.state.totalScore = 0;
                
                // UI Switch
                document.getElementById('start-screen').style.display = 'none';
                document.getElementById('game-area').style.display = 'block';
                document.getElementById('final-modal').style.display = 'none';
                
                this.updateGlobalUI();
                this.startLevel();
            },

            startLevel: function() {
                if (this.state.currentQIndex >= 5) {
                    this.finishGame();
                    return;
                }

                const q = this.state.questions[this.state.currentQIndex];
                
                // Reset Current Q State
                this.state.currentQ_attempts = 0;
                this.state.currentQ_openedParts = 0;
                document.getElementById('answer-input').value = '';
                
                // UI Updates
                document.getElementById('stage-display').innerText = `STAGE ${this.state.currentQIndex + 1} / 5 (Lv.${q.level})`;
                document.getElementById('char-count-display').innerText = `Length: ${q.text.length} chars | Hint: ${q.answerLen} chars`;
                
                // Reset Bulbs
                const bulbs = document.getElementById('attempts-container').children;
                for(let b of bulbs) {
                    b.classList.remove('broken');
                    b.classList.add('lit');
                }

                // Show Bet Modal
                this.showBetModal(q.text.length);
            },

            showBetModal: function(textLen) {
                const maxBet = Math.min(this.state.remainingMP, textLen);
                const slider = document.getElementById('bet-slider');
                slider.max = maxBet;
                slider.value = Math.ceil(maxBet / 2); // default to half
                this.updateBetDisplay();
                
                document.getElementById('bet-modal').style.display = 'flex';
            },

            updateBetDisplay: function() {
                const val = document.getElementById('bet-slider').value;
                document.getElementById('bet-val-display').innerText = val;
            },

            confirmBet: function() {
                const bet = parseInt(document.getElementById('bet-slider').value);
                this.state.remainingMP -= bet;
                this.state.currentQ_betMP = bet;
                
                document.getElementById('bet-modal').style.display = 'none';
                this.updateGlobalUI();
                this.splitQuestion(bet);
            },

            splitQuestion: function(partsCount) {
                const q = this.state.questions[this.state.currentQIndex];
                const text = q.text;
                const len = text.length;

                // Random cut points
                let cuts = new Set();
                cuts.add(0);
                cuts.add(len);
                
                while(cuts.size < partsCount + 1 && cuts.size <= len) {
                    let r = Math.floor(Math.random() * (len - 1)) + 1;
                    cuts.add(r);
                }
                
                const sortedCuts = Array.from(cuts).sort((a,b) => a-b);
                
                this.state.parts = [];
                for(let i=0; i<sortedCuts.length-1; i++) {
                    this.state.parts.push({
                        text: text.substring(sortedCuts[i], sortedCuts[i+1]),
                        opened: false,
                        index: i
                    });
                }

                this.renderParts();
            },

            renderParts: function() {
                const board = document.getElementById('question-board');
                // Remove old parts but keep background gears
                const gears = board.querySelectorAll('.bg-gear');
                board.innerHTML = '';
                gears.forEach(g => board.appendChild(g));

                this.state.parts.forEach((part, idx) => {
                    const el = document.createElement('div');
                    el.className = 'q-part';
                    if(part.opened) el.classList.add('opened');
                    
                    // Cover
                    const cover = document.createElement('div');
                    cover.className = 'plate-cover';
                    
                    // Text
                    const txt = document.createElement('div');
                    txt.className = 'plate-text';
                    txt.innerText = part.text;

                    el.appendChild(cover);
                    el.appendChild(txt);
                    
                    el.onclick = () => this.openPart(idx);
                    
                    board.appendChild(el);
                });
            },

            openPart: function(idx) {
                if(this.state.parts[idx].opened) return;
                
                this.state.parts[idx].opened = true;
                this.state.currentQ_openedParts++;
                
                // Re-render specifically this part or just update class
                const partsEl = document.querySelectorAll('.q-part');
                partsEl[idx].classList.add('opened');
            },

            submitAnswer: function() {
                const input = document.getElementById('answer-input');
                const val = input.value.trim();
                const q = this.state.questions[this.state.currentQIndex];

                if(val === q.answer) {
                    this.showFeedback(true);
                    this.calculateScore(true);
                } else {
                    this.showFeedback(false);
                    this.handleWrongAnswer();
                }
            },

            handleWrongAnswer: function() {
                this.state.currentQ_attempts++;
                const bulbs = document.getElementById('attempts-container').children;
                if(this.state.currentQ_attempts <= 3) {
                    bulbs[3 - this.state.currentQ_attempts].classList.remove('lit');
                    bulbs[3 - this.state.currentQ_attempts].classList.add('broken');
                }

                if(this.state.currentQ_attempts >= 3) {
                    // Fail
                    setTimeout(() => {
                        this.calculateScore(false);
                    }, 1000);
                }
            },

            pass: function() {
                // Just clear input and focus back to board implied
                document.getElementById('answer-input').value = '';
                // In this game logic, pass doesn't do much other than staying in phase
            },

            giveUp: function() {
                this.calculateScore(false);
            },

            calculateScore: function(isClear) {
                const q = this.state.questions[this.state.currentQIndex];
                let roundScore = 0;
                let detailsHtml = '';

                if(isClear) {
                    // 1. Clear Bonus
                    const base = q.level * 1000;
                    let multiplier = 1.0;
                    if(this.state.currentQ_attempts === 1) multiplier = 0.5;
                    if(this.state.currentQ_attempts === 2) multiplier = 0.1;
                    
                    const clearBonus = Math.floor(base * multiplier);
                    
                    // 2. Unopened Bonus
                    const totalParts = this.state.parts.length;
                    const unopened = totalParts - this.state.currentQ_openedParts;
                    const partsBonus = unopened * 100;

                    roundScore = clearBonus + partsBonus;

                    detailsHtml = `
                        <p>Answer: ${q.answer}</p>
                        <div class="result-row"><span>Clear Bonus (Lv.${q.level}):</span> <span>${clearBonus}</span></div>
                        <div class="result-row"><span>Unopened Parts (${unopened}):</span> <span>${partsBonus}</span></div>
                        <div class="result-row" style="color:var(--glow)"><span>TOTAL:</span> <span>${roundScore}</span></div>
                    `;
                    document.getElementById('result-title').innerText = "STAGE CLEARED";
                } else {
                    detailsHtml = `
                        <p style="color:red">FAILED / GIVEN UP</p>
                        <p>Answer was: ${q.answer}</p>
                        <div class="result-row"><span>Score:</span> <span>0</span></div>
                    `;
                    document.getElementById('result-title').innerText = "SYSTEM FAILURE";
                }

                this.state.totalScore += roundScore;
                this.updateGlobalUI();

                // Show Result Modal
                document.getElementById('result-details').innerHTML = detailsHtml;
                document.getElementById('result-modal').style.display = 'flex';
            },

            nextLevel: function() {
                document.getElementById('result-modal').style.display = 'none';
                this.state.currentQIndex++;
                this.startLevel();
            },

            finishGame: function() {
                // Final Resource Bonus
                const mpBonus = this.state.remainingMP * 2000;
                this.state.totalScore += mpBonus;
                
                // Rank
                let rank = 'F';
                if(this.state.totalScore > 5000) rank = 'C';
                if(this.state.totalScore > 10000) rank = 'B';
                if(this.state.totalScore > 20000) rank = 'A';
                if(this.state.totalScore > 30000) rank = 'S';

                // Save Highscore
                const currentHs = localStorage.getItem('pq_highscore') || 0;
                if(this.state.totalScore > currentHs) {
                    localStorage.setItem('pq_highscore', this.state.totalScore);
                }

                document.getElementById('final-score').innerText = this.state.totalScore;
                document.getElementById('rank-display').innerText = `RANK: ${rank} (MP Bonus: +${mpBonus})`;
                document.getElementById('game-area').style.display = 'none';
                document.getElementById('final-modal').style.display = 'flex';
            },

            updateGlobalUI: function() {
                document.getElementById('mp-display').innerText = this.state.remainingMP;
                document.getElementById('score-display').innerText = this.state.totalScore;
                
                const mpPercent = (this.state.remainingMP / 50) * 100;
                document.getElementById('mp-bar').style.width = `${mpPercent}%`;
            },

            showFeedback: function(isCorrect) {
                const fb = document.getElementById('feedback-msg');
                fb.innerText = isCorrect ? "CORRECT ANSWER" : "ERROR: INVALID INPUT";
                fb.className = isCorrect ? "correct show" : "wrong show";
                setTimeout(() => {
                    fb.className = "";
                }, 1500);
            }
        };
    </script>
</body>
</html>
